[package]
name = "soundboard"
version = "0.1.0"
description = "Big colourful buttons for your sounds."
authors = ["GhuumiRuma"]
edition = "2021"

[lib]
name = "soundboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
tauri-plugin-global-shortcut = "2.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
