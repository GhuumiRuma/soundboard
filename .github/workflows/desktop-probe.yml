name: Desktop publish probe

# Temporary. The first probe showed that a release whose tag points at an older commit that changed a workflow file
# is refused (403, the token would need the "workflows" permission), while the tip of main or no target is fine.
# This runs the publish steps one after the other, the way the publish job does, to prove the fixed shape works
# before the slow build is run again. It is deleted as soon as the answer is known.
on: workflow_dispatch

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create the release the way the publish job does, three times in a row
        shell: bash
        run: |
          set -u
          echo hello > probe.txt
          echo "notes" > notes.md

          recreate() {
            name="$1"
            shift
            if gh release view desktop-probe > /dev/null 2>&1; then
              gh release delete desktop-probe --yes --cleanup-tag
            fi
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/desktop-probe" > /dev/null 2>&1 || true
            if out="$(gh release create desktop-probe probe.txt --title probe --latest=false --notes-file notes.md "$@" 2>&1)"; then
              echo "OK      $name"
            else
              echo "FAILED  $name :: $out"
            fi
          }

          recreate "first time, no target"
          gh release view desktop-probe --json assets,isDraft,isPrerelease --jq '"  draft=\(.isDraft) prerelease=\(.isPrerelease) assets=\([.assets[].name])"' || true
          curl --fail --silent --show-error --location --range 0-0 --retry 5 --retry-delay 5 --retry-all-errors --output /dev/null "https://github.com/$GH_REPO/releases/download/desktop-probe/probe.txt" && echo "  the public link answers"
          recreate "second time, replacing the first, no target"
          recreate "third time, target is main" --target main

          echo "--- clean up ---"
          gh release delete desktop-probe --yes --cleanup-tag || true
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/desktop-probe" > /dev/null 2>&1 || true
          echo "--- what is left (the Android release should still be the Latest one) ---"
          gh release list --limit 10
          git ls-remote --tags "https://github.com/$GH_REPO.git" | grep -c probe || true
