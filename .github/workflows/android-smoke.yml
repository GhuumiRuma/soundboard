name: Android emulator check

# Manual only (Actions tab > Android emulator check > Run workflow). Starts an Android phone in an emulator,
# installs the latest published Soundboard.apk, opens it and checks it is still running 15 seconds later.
# The screenshot and the phone's log are attached to the run as "Soundboard-emulator".
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Download the latest published app
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download android-latest --repo "$GITHUB_REPOSITORY" --pattern Soundboard.apk

      # Without this the emulator can't use the runner's hardware acceleration and is far too slow.
      - name: Allow hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open the app in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash android/smoke-test.sh Soundboard.apk

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: Soundboard-emulator
          path: android/smoke-output
          if-no-files-found: warn
